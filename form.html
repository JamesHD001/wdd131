<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Henry Daniel James">
  <meta name="description" content="Product review assignment for week05, using html, css and javascript">
  <title>Product Review</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles/form.css"> 
  <link rel="stylesheet" href="./styles/form-large.css">
  <script src="./scripts/form.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review Form</h1>
  </header>

  <main>
    <form method="get" action="review.html">

      <!-- Product -->
      <label for="product">Product Name *</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <fieldset>
        <legend>Overall Rating *</legend>
      
        <div class="rating-container">
          
          <div class="rating-item">
            <span>★</span>
            <input type="radio" id="rate1" name="rating" value="1" required aria-label="1 star">
          </div>
      
          <div class="rating-item">
            <span>★★</span>
            <input type="radio" id="rate2" name="rating" value="2" aria-label="2 stars">
          </div>
      
          <div class="rating-item">
            <span>★★★</span>
            <input type="radio" id="rate3" name="rating" value="3" aria-label="3 stars">
          </div>
      
          <div class="rating-item">
            <span>★★★★</span>
            <input type="radio" id="rate4" name="rating" value="4" aria-label="4 stars">
          </div>
      
          <div class="rating-item">
            <span>★★★★★</span>
            <input type="radio" id="rate5" name="rating" value="5" aria-label="5 stars">
          </div>

        </div>
      </fieldset>

      <div class="two-column">
            <div>
                <label for="installDate">Date of Installation *</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>
      </div>

      <fieldset>
        <legend>Useful Features</legend>
      
        <p>Which features did you find useful in this product?</p>
        <p class="italics">(Check all that apply)</p>
      
        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="checkbox" id="speed" name="features" value="speed">
            <label for="speed">Speed</label>
          </div>
      
          <div class="checkbox-item">
            <input type="checkbox" id="durability" name="features" value="durability">
            <label for="durability">Durability</label>
          </div>
      
          <div class="checkbox-item">
            <input type="checkbox" id="design" name="features" value="design">
            <label for="design">Design</label>
          </div>
      
          <div class="checkbox-item">
            <input type="checkbox" id="efficiency" name="features" value="efficiency">
            <label for="efficiency">Efficiency</label>
          </div>
        </div>
      </fieldset>

      <label for="review">Written Review <span class="optional">(optional)</span></label>
      <textarea id="review" name="review"></textarea>

        <div>
            <div>
                <label for="username">Your Name <span class="optional">(optional)</span></label>
                <input type="text" id="username" name="username">
            </div>
        </div>

      <input type="submit" value="Submit Review">

    </form>
  </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Henry Daniel James | Nigeria
        </p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
